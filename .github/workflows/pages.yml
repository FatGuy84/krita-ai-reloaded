name: Pages

on:
  push:
    branches: [ux/improvements]
    paths:
      - "site/**"
      - "ai_diffusion/icons/logo-128.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R "$GITHUB_REPOSITORY" --json tagName,publishedAt > release.json
          cat release.json

      # site/index.html is written without a document skeleton (claude.ai artifacts add their
      # own). Everything up to the end of its <style> block belongs in <head>.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp ai_diffusion/icons/logo-128.png _site/
          python3 - <<'EOF'
          import json, re
          from datetime import datetime

          page = open("site/index.html", encoding="utf-8").read()
          cut = page.index("</style>") + len("</style>")
          head, body = page[:cut], page[cut:]

          # Version strings on the page are marked with data-release; fill them from the release
          rel = json.load(open("release.json"))
          tag = rel["tagName"]
          date = datetime.fromisoformat(rel["publishedAt"].replace("Z", "+00:00"))
          values = {"tag": tag, "upstream": tag.split("-")[0], "date": f"{date.day} {date:%B %Y}"}
          body = re.sub(r'(<(\w+) data-release="(\w+)">)[^<]*(</\2>)',
                        lambda m: m.group(1) + values[m.group(3)] + m.group(4), body)

          open("_site/index.html", "w", encoding="utf-8").write(
              '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
              '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
              '<link rel="icon" href="logo-128.png">\n' + head + "\n</head>\n<body>\n" + body
              + "\n</body>\n</html>\n")
          print(values)
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
