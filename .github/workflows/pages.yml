name: Pages

on:
  push:
    branches: [ux/improvements]
    paths:
      - "site/**"
      - "media/**"
      - "ai_diffusion/icons/logo-128.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page references its assets next to itself; copy them from where the repo keeps
      # them instead of checking in duplicates.
      - name: Assemble site
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          # site/index.html is written without a document skeleton (claude.ai artifacts add their own)
          { printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<link rel="icon" href="logo-128.png">\n</head>\n<body>\n'
            cat site/index.html
            printf '\n</body>\n</html>\n'; } > _site/index.html
          cp ai_diffusion/icons/logo-128.png _site/
          for f in demo-wildcards demo-loop-generate demo-lora-browser demo-favorites; do
            cp "media/$f.gif" _site/media/
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
